spring:
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:3306/Student_info?createDatabaseIfNotExist=true
    username: root
    password: ${DB_PASSWORD:}

  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema (src/main/resources/db/migration); Hibernate only checks it matches the entities
      ddl-auto: validate

  data:
    web:
      pageable:
        max-page-size: 100

  jackson:
    mapper:
      # Accept "male" / "Male" as well as "MALE" for the gender enum
      accept-case-insensitive-enums: true

app:
  cors:
    allowed-origins:
      - http://localhost:5173
      - http://localhost:3000
