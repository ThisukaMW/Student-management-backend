spring:
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:3306/Student_info?createDatabaseIfNotExist=true
    username: root
    password: ${DB_PASSWORD:}

  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema (src/main/resources/db/migration); Hibernate only checks it matches the entities
      ddl-auto: validate
    properties:
      # Store created_at / updated_at / expiry times in UTC, whatever the server's time zone
      hibernate.jdbc.time_zone: UTC

  data:
    web:
      pageable:
        max-page-size: 100

  jackson:
    mapper:
      # Accept "male" / "Male" as well as "MALE" for the gender enum
      accept-case-insensitive-enums: true

app:
  security:
    jwt:
      # Required: at least 32 bytes. Set JWT_SECRET in .env or the environment; startup fails without it
      secret: ${JWT_SECRET:}
      issuer: student-management
      access-token-ttl: 15m
      refresh-token-ttl: 7d

  # First admin, created on startup only if no ADMIN exists. Leave unset to skip (a warning is logged)
  admin:
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}

  cors:
    allowed-origins:
      - http://localhost:5173
      - http://localhost:3000
      # VS Code Live Server, used by the HTML frontend
      - http://127.0.0.1:5500
      - http://localhost:5500
